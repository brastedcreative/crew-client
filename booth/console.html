<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Booth console</title>
<!-- Headshot booth: the photographer's console (?c=<console token>). Backend: the `booth` Edge Function.
     Source of truth: web/client/booth in the crew schedule app repo. -->
<style>
:root{--bg:#1B1C1B;--panel:#252624;--panel2:#2E2F2C;--line:#3A3B38;--ink:#ECECE8;--muted:#A3A49E;--dim:#7C7D77;
  --accent:#E58A9B;--soft:#3D2329;--btn:#7E2436;--ok:#76CC98;--ok-soft:#1F3428;--warn:#E5B15C;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI','Helvetica Neue',Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px}
button{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:14px 28px;background:var(--panel);border-bottom:1px solid var(--line)}
header b{font-size:24px;letter-spacing:-.02em}
header .sub{font-size:13.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--panel2);font-size:13.5px;color:var(--muted)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--dim)}.pill.ok i{background:var(--ok)}.pill.warn i{background:var(--warn)}
.tags{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
main{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:18px;padding:20px 28px}
@media (max-width:900px){main{grid-template-columns:1fr;padding:16px}header{padding:12px 16px}}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.p{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--panel2)}
.p .who{flex:1;min-width:0}.p .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p small{color:var(--muted);font-size:12.5px}
.btn{min-height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:600;cursor:pointer}
.btn.primary{background:var(--btn);border-color:var(--btn);color:#fff}
.btn.big{min-height:52px;font-size:17px;flex:1}
.now{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:12px;background:var(--soft)}
.now b{font-size:30px;letter-spacing:-.02em}
.stat{display:flex;gap:24px;color:var(--muted)}.stat strong{display:block;color:var(--ink);font-size:28px}
.empty{color:var(--dim);font-size:14px;padding:8px 2px}
.note{font-size:13px;color:var(--muted);line-height:1.45}
.err{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#3D2120;color:#F08A80;padding:10px 16px;border-radius:10px}
.st{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--panel);white-space:nowrap}.st.ok{background:var(--ok-soft);color:var(--ok)}
</style>
</head>
<body>
<div id="app"><p style="padding:24px">Loading…</p></div>
<script>
const API = "https://trgwbsqwobqkbtyuoric.supabase.co/functions/v1/booth";
const C = new URLSearchParams(location.search).get("c") || "";
const app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let state = null, busy = false;

async function api(path, body) {
  const res = await fetch(API + path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || "Something went wrong.");
  return j;
}
const ago = (t) => { if (!t) return null; const s = Math.max(0, Math.round((Date.now() - new Date(t)) / 1000));
  return s < 60 ? `${s} s ago` : s < 3600 ? `${Math.round(s / 60)} min ago` : `${Math.round(s / 3600)} h ago`; };
const clock = (t) => new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const timer = (t) => { const s = Math.max(0, Math.round((Date.now() - new Date(t)) / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

function render() {
  const s = state, all = s.sitters;
  const now = all.find((x) => x.status === "shooting"), waiting = all.filter((x) => x.status === "waiting"), done = all.filter((x) => x.status === "done");
  const last = s.last_photo ? (Date.now() - new Date(s.last_photo)) / 1000 : null;
  const cam = s.ftp_state !== "ready" ? ["warn", s.ftp_state === "pending" ? "Camera login being set up…" : "Camera login " + s.ftp_state]
    : last === null ? ["", "Camera: no photos yet"] : [last < 600 ? "ok" : "", `Camera: last photo ${ago(s.last_photo)}`];
  const face = s.matching === "face", live = s.delivery === "live";
  app.innerHTML = `<header><div><b>${esc(s.name)}</b><div class="sub">${esc(s.studio)} · event folder ${esc(s.code)}${s.open ? "" : " · closed"}</div></div>
    <span class="pill ${cam[0]}"><i></i>${esc(cam[1])}</span>
    <div class="tags"><span class="pill">${live ? "Live delivery" : "After editing"}</span><span class="pill">${face ? "Face matching" : "Queue matching"}</span></div></header>
  <main>
    <section><h2>Waiting · ${waiting.length}</h2>
      ${waiting.length ? waiting.map((p) => `<div class="p"><div class="who"><b>${esc(p.name)}</b><small>${esc(p.company || "")}${p.company ? " · " : ""}in at ${clock(p.checked_in_at)}</small></div>
        <button class="btn" data-a="left" data-id="${p.id}" title="Not here any more">✕</button><button class="btn primary" data-a="shoot" data-id="${p.id}">Shoot</button></div>`).join("")
        : `<div class="empty">Nobody waiting. New check-ins show up here.</div>`}
    </section>
    <section><h2>Now shooting</h2>
      ${now ? `<div class="now"><b>${esc(now.name)}</b>
        <div class="stat"><div><strong id="t" data-t="${esc(now.started_at)}">${timer(now.started_at)}</strong>session</div><div><strong>${now.photos}</strong>photos in</div></div>
        <div style="display:flex;gap:10px"><button class="btn" data-a="back" data-id="${now.id}">Back to waiting</button><button class="btn primary big" data-a="done" data-id="${now.id}">Done · next person</button></div></div>
        <div class="note">${face ? "Face matching sorts the photos, so it's fine to keep shooting while the next person steps in."
          : "Queue matching: every photo that arrives from the camera while this person is up goes to them. Wait for the last frame to land before tapping Done."}</div>`
        : `<div class="empty">Tap Shoot next to the next person.</div>`}
      ${s.unmatched ? `<div class="note">${s.unmatched} photo${s.unmatched === 1 ? "" : "s"} not matched to anyone yet${face ? " (still matching, or no face found)" : " (taken while nobody was up)"}.</div>` : ""}
    </section>
    <section><h2>Done · ${done.length}</h2>
      ${done.length ? done.map((p) => `<div class="p"><div class="who"><b>${esc(p.name)}</b><small>${p.photos} photo${p.photos === 1 ? "" : "s"}${live ? "" : ` · ${p.edited} edited`}</small></div>
        <span class="st ${p.notified ? "ok" : ""}">${p.notified ? "Sent" : live ? "Sending soon" : "Waiting for edits"}</span>
        <button class="btn" data-a="shoot" data-id="${p.id}" title="Shoot again">↺</button></div>`).join("")
        : `<div class="empty">Nobody yet.</div>`}
    </section>
  </main>`;
  app.querySelectorAll("[data-a]").forEach((b) => b.onclick = () => act(b.dataset.a, b.dataset.id));
}

async function act(action, id) {
  if (busy) return;
  busy = true;
  try { state = await api("/console", { c: C, action, id }); render(); }
  catch (e) { const d = document.createElement("div"); d.className = "err"; d.textContent = e.message; document.body.append(d); setTimeout(() => d.remove(), 4000); }
  finally { busy = false; }
}
async function load() { if (busy) return; try { state = await api(`/console?c=${encodeURIComponent(C)}`); render(); } catch (e) { if (!state) app.innerHTML = `<p style="padding:24px">${esc(e.message)}</p>`; } }

if (!/^[A-Za-z0-9]{32,128}$/.test(C)) app.innerHTML = `<p style="padding:24px">This console link isn't valid.</p>`;
else { load(); setInterval(load, 4000); setInterval(() => { const t = document.getElementById("t"); if (t) t.textContent = timer(t.dataset.t); }, 1000); }
</script>
</body>
</html>
