<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Find My Photos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Find my photos: guests sign up with a selfie (?e=<desk token>), then open their private link (?g=<guest token>).
     ?e=<token>&print=1 is the printable QR poster. Backend: the `faces` Edge Function. Source of truth: web/client/find
     in the crew schedule app repo. -->
<style>
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --sunk:#E9ECE6; --line:#D5DAD1; --ink:#18201D; --muted:#5D6762;
  --accent:#7E2436; --accent-soft:#F3E3E6; --accent-ink:#FFFFFF; --bad:#B3261E; --bad-soft:#F7E0DE; --ok:#2F7A4F; --ok-soft:#E1F0E6;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1A201D; --sunk:#232A26; --line:#323B36; --ink:#E6EBE7; --muted:#9AA59F;
  --accent:#E07A8C; --accent-soft:#3A2228; --accent-ink:#1A0D10; --bad:#F08A80; --bad-soft:#3D2120; --ok:#6FCB94; --ok-soft:#1C3326; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1A201D; --sunk:#232A26; --line:#323B36; --ink:#E6EBE7; --muted:#9AA59F;
  --accent:#E07A8C; --accent-soft:#3A2228; --accent-ink:#1A0D10; --bad:#F08A80; --bad-soft:#3D2120; --ok:#6FCB94; --ok-soft:#1C3326; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
a{color:var(--accent);font-weight:600}
button,input{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.narrow{max-width:520px}
header{background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:14px;padding-top:16px;padding-bottom:16px}
.logo{height:40px;max-width:120px;display:flex;align-items:center;justify-content:center;border-radius:8px;overflow:hidden;flex:none}
.logo img{height:100%;width:auto;display:block}
h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.01em;text-transform:uppercase;margin:0;line-height:1.05}
h2{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;margin:0 0 8px;letter-spacing:.02em}
.sub{font-size:13px;color:var(--muted)}
main{padding:20px 0 56px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.card + .card{margin-top:14px}
p{margin:0 0 12px}
.m{color:var(--muted);font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 16px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
label.f{display:block;font-weight:600;margin:14px 0 6px}
input[type=email],input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
input[type=email]:focus,input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px}
.selfie{display:flex;align-items:center;gap:14px;margin-top:6px}
.selfie .ph{width:84px;height:84px;border-radius:50%;background:var(--sunk);border:1px dashed var(--line);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.selfie .ph img{width:100%;height:100%;object-fit:cover}
.consent{display:flex;gap:10px;align-items:flex-start;margin:16px 0;font-size:13.5px;color:var(--muted)}
.consent input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--accent)}
.err{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 12px;margin:12px 0 0;font-size:14px}
.done{background:var(--ok-soft);border-radius:12px;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:14px}
.grid button{border:0;padding:0;background:var(--sunk);border-radius:8px;overflow:hidden;aspect-ratio:1;cursor:zoom-in}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.ev{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 0}
.lb{position:fixed;inset:0;background:rgba(10,12,11,.94);display:none;flex-direction:column;z-index:10}
.lb.on{display:flex}
.lb .bar{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 16px}
.lb .credit{margin-right:auto;color:#d7ddd9;font-size:13.5px;line-height:1.3;min-width:0}
.lb .credit a{color:#fff}
.lb .bar .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
.lb .pic{flex:1;display:flex;align-items:center;justify-content:center;padding:0 12px 16px;min-height:0}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.foot{margin-top:28px;font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline}
.poster{text-align:center;padding:40px 16px}
.poster h1{font-size:56px}
.poster .q{display:inline-block;background:#fff;padding:18px;border-radius:12px;margin:26px 0 18px}
.poster .steps{font-size:20px;line-height:1.6;color:var(--ink)}
.vip{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.vip:first-of-type{border-top:0;padding-top:4px}
.vip .who{flex:1;min-width:0}
.vip .hs{width:48px;height:48px;border-radius:50%;background:var(--sunk);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700}
.vip .hs img{width:100%;height:100%;object-fit:cover}
.vip .who b{display:block}
.vip .acts{display:flex;gap:6px;flex:none}
.vip .acts .btn{padding:7px 12px;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--sunk);border-radius:999px;padding:2px 10px;font-size:12.5px}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.sess{display:grid;grid-template-columns:1fr;gap:4px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.sess label{display:flex;gap:8px;align-items:center;font-size:14px}
.sess input{width:18px;height:18px;accent-color:var(--accent);flex:none}
@media print{.noprint{display:none} body{background:#fff;color:#000} .poster h1{font-size:64px}}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:s .8s linear infinite;display:inline-block}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
</style>
</head>
<body>
<div id="app"><main><div class="wrap narrow"><p class="m">Loading…</p></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
const API = "https://trgwbsqwobqkbtyuoric.supabase.co/functions/v1/faces";
const app = document.getElementById("app");
const q = new URLSearchParams(location.search);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TOKEN = /^[A-Za-z0-9]{32,128}$/;

async function api(path, body) {
  const res = await fetch(API + path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || "Something went wrong. Please try again.");
  return j;
}

function header(ev) {
  const logo = ev.logo?.data && /^data:image\//.test(ev.logo.data)
    ? `<div class="logo" style="${ev.logo.bg && ev.logo.bg !== "none" ? "background:" + esc(ev.logo.bg) + ";padding:4px" : ""}"><img src="${esc(ev.logo.data)}" alt=""></div>` : "";
  return `<header><div class="wrap">${logo}<div><h1>${esc(ev.name || "Your photos")}</h1><div class="sub">Find my photos · Josh Brasted Photography</div></div></div></header>`;
}
const page = (ev, inner, narrow = true) => { app.innerHTML = `${header(ev)}<main><div class="wrap${narrow ? " narrow" : ""}">${inner}</div></main>`; };
const fail = (msg) => { app.innerHTML = `<main><div class="wrap narrow"><div class="card"><h2>Hmm.</h2><p>${esc(msg)}</p></div></div></main>`; };

// Shrink the selfie to 1200 px JPEG before sending (fast on event Wi-Fi, well under Rekognition's 5 MB).
async function shrink(file) {
  const img = await createImageBitmap(file, { imageOrientation: "from-image" }).catch(() => null);
  if (!img) throw new Error("That file isn't a photo we can read. Try taking a new selfie.");
  const k = Math.min(1, 1200 / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.88);
}

// ---------------------------------------------------------------- printable QR poster (?e=…&print=1)
function poster(ev, token) {
  const link = `${location.origin}${location.pathname}?e=${token}`;
  page(ev, `<div class="poster"><h1>Find your photos</h1>
    <div class="q" id="qr"></div>
    <div class="steps">1. Scan with your phone camera<br>2. Take a quick selfie<br>3. Get a private link to every photo you're in</div>
    <p class="m" style="margin-top:22px">${esc(ev.name)} · Josh Brasted Photography</p>
    <p class="noprint" style="margin-top:22px"><button class="btn primary" onclick="print()">Print</button> <a class="btn" href="${esc(link)}">Open the sign-up page</a></p></div>`, false);
  const box = document.getElementById("qr");
  if (window.qrcode) { const qr = qrcode(0, "M"); qr.addData(link); qr.make(); box.innerHTML = qr.createSvgTag({ cellSize: 6, margin: 0, scalable: true }); box.firstChild.style.width = "300px"; box.firstChild.style.height = "300px"; }
  else box.textContent = link;
}

// ---------------------------------------------------------------- sign-up (?e=…)
function signup(ev, token) {
  if (!ev.open) return page(ev, `<div class="card"><h2>Matching is closed</h2><p>Photo matching for ${esc(ev.name)} has ended. If you already signed up, your emailed link still works until it expires.</p></div>`);
  const when = ev.mode === "approval" ? "once they're edited and approved" : "as soon as the photographers upload them";
  page(ev, `<div class="card">
    <h2>Get the photos you're in</h2>
    <p>Take a quick selfie and we'll find you in the event photos. You'll get a private link by email, with your photos ${when}.</p>
    <form id="f" novalidate>
      <label class="f" for="em">Your email</label>
      <input id="em" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required>
      <label class="f">Your selfie</label>
      <div class="selfie"><div class="ph" id="ph">No photo</div>
        <div><label class="btn" for="cam">Take a selfie</label><input id="cam" type="file" accept="image/*" capture="user" hidden>
        <div class="m" style="margin-top:6px">Face the camera, good light, no sunglasses.</div></div></div>
      <label class="consent"><input type="checkbox" id="ok">
        <span>I agree that Josh Brasted Photography may use my selfie to make a face template and compare it with photos taken at ${esc(ev.name)} to find photos of me. The selfie itself isn't stored. My face template and email are deleted ${esc(ev.keep_days)} days after the event ends, or right away if I choose "Delete my data" on my photo link. They aren't sold or shared, except with Amazon Web Services, which does the matching for us.</span></label>
      <button class="btn primary block" id="go" type="submit">Find my photos</button>
      <div id="msg"></div>
    </form></div>`);
  let selfie = null;
  const $ = (id) => document.getElementById(id);
  $("cam").onchange = async () => {
    const file = $("cam").files[0]; if (!file) return;
    try { selfie = await shrink(file); $("ph").innerHTML = `<img src="${selfie}" alt="Your selfie">`; $("msg").innerHTML = ""; }
    catch (e) { $("msg").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  };
  $("f").onsubmit = async (e) => {
    e.preventDefault();
    const email = $("em").value.trim();
    const err = !/^\S+@\S+\.\S+$/.test(email) ? "Enter your email address." : !selfie ? "Take a selfie first." : !$("ok").checked ? "Tick the box to agree first." : "";
    if (err) { $("msg").innerHTML = `<div class="err">${esc(err)}</div>`; return; }
    $("go").disabled = true; $("go").innerHTML = `<span class="spin"></span> Looking for you…`;
    try {
      await api("/register", { e: token, email, consent: true, selfie });
      page(ev, `<div class="done"><h2>Check your email</h2><p>We sent your private photo link to <b>${esc(email)}</b>. It fills up as more photos arrive, and we'll email you when there are new ones.</p><p class="m">Nothing there in a few minutes? Check your spam folder, or sign up again with the same email.</p></div>`);
    } catch (x) {
      $("msg").innerHTML = `<div class="err">${esc(x.message)}</div>`;
      $("go").disabled = false; $("go").textContent = "Find my photos";
    }
  };
}

// ---------------------------------------------------------------- my photos (?g=…)
async function mine(token) {
  let d;
  try { d = await api(`/photos?g=${token}`); } catch (e) { return fail(e.message); }
  const groups = [];
  for (const p of d.photos) { const last = groups.at(-1); if (last && last.event === p.event) last.list.push(p); else groups.push({ event: p.event, list: [p] }); }
  const until = d.delete_at ? new Date(d.delete_at).toLocaleDateString(undefined, { month: "long", day: "numeric" }) : "";
  const empty = d.mode === "approval"
    ? "No approved photos of you yet. Photos show up here after they're edited and approved, and we'll email you when they do."
    : "No photos of you yet. They show up here as the photographers upload, and we'll email you when they do.";
  let i = 0;
  page(d, `<p><b>${d.photos.length} ${d.photos.length === 1 ? "photo" : "photos"}</b> of you so far. <span class="m">Tap a photo to see it full size and download it.</span></p>
    ${d.photos.length ? groups.map((g) => `${g.event ? `<div class="ev">${esc(g.event)}</div>` : ""}<div class="grid">${g.list.map((p) => `<button data-i="${i++}" aria-label="Open photo"><img loading="lazy" src="${esc(p.s)}" alt=""></button>`).join("")}</div>`).join("")
      : `<div class="card"><p style="margin:0">${esc(empty)}</p></div>`}
    <div class="foot">This link is private to ${esc(d.email)}; anyone you share it with can see these photos. ${until ? `Your face data is deleted on ${esc(until)}.` : ""}
      <button class="linkbtn" id="del">Delete my data now</button></div>
    <div class="lb" id="lb" role="dialog" aria-modal="true"><div class="bar"><div class="credit" id="cr"></div><a class="btn" id="dl" href="#">Download</a><button class="btn" id="x">Close</button></div><div class="pic"><img id="big" alt=""></div></div>`, false);
  const lb = document.getElementById("lb"), big = document.getElementById("big"), dl = document.getElementById("dl"), cr = document.getElementById("cr");
  const credit = (p) => !p.by ? "" : `Photo by ${esc(p.by)}${p.ig ? `<br><a href="https://www.instagram.com/${encodeURIComponent(p.ig)}/" target="_blank" rel="noopener">@${esc(p.ig)}</a>` : ""}`;
  let at = 0;
  const open = (n) => { at = (n + d.photos.length) % d.photos.length; const p = d.photos[at]; big.src = p.l; dl.href = p.dl; cr.innerHTML = credit(p); lb.classList.add("on"); };
  app.querySelectorAll(".grid button").forEach((b) => b.onclick = () => open(Number(b.dataset.i)));
  document.getElementById("x").onclick = () => { lb.classList.remove("on"); big.removeAttribute("src"); };
  document.addEventListener("keydown", (e) => {
    if (!lb.classList.contains("on")) return;
    if (e.key === "Escape") document.getElementById("x").click();
    if (e.key === "ArrowRight") open(at + 1);
    if (e.key === "ArrowLeft") open(at - 1);
  });
  let sx = null;
  lb.addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener("touchend", (e) => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) open(at + (dx < 0 ? 1 : -1)); sx = null; });
  document.getElementById("del").onclick = async () => {
    if (!confirm("Delete your face data and this link? You won't get more photos unless you sign up again.")) return;
    try { await api("/forget", { g: token }); page(d, `<div class="card"><h2>Deleted</h2><p>Your face data, email and photo link have been deleted.</p></div>`); }
    catch (e) { alert(e.message); }
  };
}

// ---------------------------------------------------------------- VIP list (?v=…), for producers
// The people to name in the photos. Goblin Editor adds their names to Persons shown, and names plus keywords to
// Keywords, on every frame they're found in.
const initials = (n) => n.split(/\s+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
async function vipPage(token) {
  let d;
  try { d = await api(`/vips?v=${token}`); } catch (e) { return fail(e.message); }
  const $ = (id) => document.getElementById(id);
  const sessionName = new Map(d.sessions.map((s) => [s.key, s.title ? `${s.key} ${s.title}` : s.key]));
  let editing = null, headshot = null;
  const render = () => {
    page(d, `<div class="card">
      <h2>VIPs</h2>
      <p>Add the people who should be named in the photos: speakers, honorees, sponsors. Use one clear headshot each. When they're found in a frame, Goblin Editor fills in <b>Persons shown</b> with their name and adds their keywords.</p>
      <p class="m">The crew app shows each VIP's headshot on the Shot List of every session that names them in its title or description, or that you tick for them below.</p>
      ${d.enabled ? "" : `<div class="err">Face search is off for this event, so VIPs can't be added.</div>`}
      ${d.enabled && d.mode !== "live" ? `<div class="err">VIP tagging only runs for Live events. This event is set to After approval, so names won't be added until it's switched to Live.</div>` : ""}
      ${d.vips.length ? d.vips.map((v) => `<div class="vip"><div class="hs">${v.headshot ? `<img src="${esc(v.headshot)}" alt="">` : esc(initials(v.name))}</div><div class="who"><b>${esc(v.name)}</b>
          <div class="chips">${v.ready ? `<span class="chip ok">${v.photos} ${v.photos === 1 ? "photo" : "photos"}</span>` : `<span class="chip">No face yet</span>`}
          ${v.headshot ? "" : `<span class="chip">No headshot in the app: Edit and choose it again</span>`}
          ${(v.keywords || []).map((k) => `<span class="chip">${esc(k)}</span>`).join("")}</div>
          <div class="m" style="margin-top:6px">${v.events?.length ? "Only in: " + v.events.map((k) => esc(sessionName.get(k) || k)).join(", ") : "Any session"}</div></div>
        <div class="acts"><button class="btn" data-edit="${esc(v.id)}">Edit</button><button class="btn" data-del="${esc(v.id)}" aria-label="Remove ${esc(v.name)}">Remove</button></div></div>`).join("")
        : `<p class="m" style="margin:0">No VIPs yet.</p>`}
    </div>
    ${d.enabled ? `<div class="card" id="formcard">
      <h2>${editing ? "Edit " + esc(editing.name) : "Add a VIP"}</h2>
      <form id="vf" novalidate>
        <label class="f" for="vn">Name, as it should appear in Persons shown</label>
        <input id="vn" type="text" maxlength="120" autocomplete="off" value="${esc(editing?.name || "")}">
        <label class="f">Headshot${editing ? " (only to replace it)" : ""}</label>
        <div class="selfie"><div class="ph" id="ph">${editing ? (editing.headshot ? `<img src="${esc(editing.headshot)}" alt="Headshot">` : "Kept") : "No photo"}</div>
          <div><label class="btn" for="hs">Choose photo</label><input id="hs" type="file" accept="image/*" hidden>
          <div class="m" style="margin-top:6px">Just them, facing the camera. Used to find them in the photos, and shown to your crew in the app's Shot List.</div></div></div>
        <label class="f" for="vk">Keywords <span class="m">(comma separated, optional)</span></label>
        <input id="vk" type="text" autocomplete="off" placeholder="Keynote speaker, CEO" value="${esc((editing?.keywords || []).join(", "))}">
        <label class="f">Sessions <span class="m">(none ticked = any session)</span></label>
        ${d.sessions.length ? `<div class="sess">${d.sessions.map((s) => `<label><input type="checkbox" value="${esc(s.key)}" ${editing?.events?.includes(s.key) ? "checked" : ""}> ${esc(sessionName.get(s.key))}</label>`).join("")}</div>` : `<p class="m">No sessions on the schedule yet.</p>`}
        <p style="margin-top:16px;display:flex;gap:8px"><button class="btn primary" id="vs" type="submit">${editing ? "Save" : "Add VIP"}</button>
          ${editing ? `<button class="btn" type="button" id="vc">Cancel</button>` : ""}</p>
        <div id="msg"></div>
      </form></div>` : ""}`);
    app.querySelectorAll("[data-edit]").forEach((b) => b.onclick = () => { editing = d.vips.find((v) => v.id === b.dataset.edit); headshot = null; render(); $("formcard").scrollIntoView({ behavior: "smooth" }); $("vn").focus(); });
    app.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
      const v = d.vips.find((x) => x.id === b.dataset.del);
      if (!confirm(`Remove ${v.name}? Their name won't be added to any more photos.`)) return;
      try { await api("/vips/delete", { v: token, id: v.id }); await reload(); } catch (e) { alert(e.message); }
    });
    if (!d.enabled) return;
    if ($("vc")) $("vc").onclick = () => { editing = null; headshot = null; render(); };
    $("hs").onchange = async () => {
      const file = $("hs").files[0]; if (!file) return;
      try { headshot = await shrink(file); $("ph").innerHTML = `<img src="${headshot}" alt="Headshot">`; $("msg").innerHTML = ""; }
      catch (e) { $("msg").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    };
    $("vf").onsubmit = async (e) => {
      e.preventDefault();
      const name = $("vn").value.trim();
      const err = !name ? "Add the person's name." : !editing && !headshot ? "Add a headshot." : "";
      if (err) { $("msg").innerHTML = `<div class="err">${esc(err)}</div>`; return; }
      const keywords = $("vk").value.split(",").map((k) => k.trim()).filter(Boolean);
      const events = [...app.querySelectorAll(".sess input:checked")].map((c) => c.value);
      $("vs").disabled = true; $("vs").innerHTML = `<span class="spin"></span> ${headshot ? "Looking for them…" : "Saving…"}`;
      try {
        await api("/vips", { v: token, id: editing?.id, name, keywords, events, ...(headshot ? { photo: headshot } : {}) });
        editing = null; headshot = null; await reload();
      } catch (x) {
        $("msg").innerHTML = `<div class="err">${esc(x.message)}</div>`;
        $("vs").disabled = false; $("vs").textContent = editing ? "Save" : "Add VIP";
      }
    };
  };
  const reload = async () => { d = await api(`/vips?v=${token}`); render(); };
  render();
}

// ----------------------------------------------------------------
(async () => {
  const e = q.get("e"), g = q.get("g"), v = q.get("v");
  if (v && TOKEN.test(v)) return vipPage(v);
  if (g && TOKEN.test(g)) return mine(g);
  if (e && TOKEN.test(e)) {
    let ev;
    try { ev = await api(`/event?e=${e}`); } catch (x) { return fail(x.message); }
    return q.get("print") ? poster(ev, e) : signup(ev, e);
  }
  fail("Scan the QR code at your event to find your photos, or open the link we emailed you.");
})();
</script>
